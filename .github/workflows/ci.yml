name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  fast:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Set up Python
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Fast tests (excluding gate)
        run: uv run pytest tests/ -x -m "not gate"

      - name: Ruff
        run: uv run ruff check kbat/ tests/ scripts/

  gate:
    runs-on: ubuntu-latest
    needs: fast
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Validation gate (criteria 1.G.a-e)
        run: uv run pytest tests/gate/ -v

      - name: Mock-policy lint
        run: uv run python scripts/check_mock_policy.py tests/

      - name: Hypothesis-mask lint
        run: uv run python scripts/check_hypothesis_masks.py tests/
