[project]
name = "kbat"
version = "0.1.0.dev0"
description = "Declarative, idempotent YAML-manifest batch edits for KiCad schematics"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Alex Kechichian"}]
keywords = ["kicad", "eda", "schematic", "cli", "yaml"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "akcli-kicad>=0.22.0,<0.23",
    "pyyaml>=6.0",
    "sexpdata>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/AlexK-Notable/kbat"
Repository = "https://github.com/AlexK-Notable/kbat"
Issues = "https://github.com/AlexK-Notable/kbat/issues"

[project.scripts]
kbat = "kbat.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored upstream fixtures are not project source — exempt from lint.
extend-exclude = ["tests/fixtures/validation_gate/cleanup.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
markers = [
    "gate: validation gate criteria 1.G.a-e (~60s; required for merge)",
]
# /tmp is RAM-backed on the dev host; keep only failing tests' tmp dirs.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
